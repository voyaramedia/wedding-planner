<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1E27"/>
      <stop offset="50%" stop-color="#311219"/>
      <stop offset="100%" stop-color="#1F0A10"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#B88A2D"/>
      <stop offset="100%" stop-color="#8C631B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with slight rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Outer decorative border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>
  <rect x="36" y="36" width="440" height="440" rx="76" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- Interlocking Wedding Rings Crest -->
  <g transform="translate(256, 240)" filter="url(#glow)">
    <!-- Groom Ring (Left) -->
    <circle cx="-52" cy="0" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round"/>
    <!-- Bride Ring (Right) -->
    <circle cx="52" cy="0" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round"/>

    <!-- Interlocking overlap arc -->
    <path d="M 0,-84 A 88 88 0 0 1 32,-45" fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round"/>
    
    <!-- Solitaire Diamond atop Bride's ring -->
    <g transform="translate(52, -88)">
      <polygon points="0,-36 24,-12 14,0 -14,0 -24,-12" fill="#FFFFFF" opacity="0.95"/>
      <polygon points="0,-36 10,-12 0,0 -10,-12" fill="#FFF8D6" opacity="0.8"/>
      <!-- Sparkle rays -->
      <line x1="0" y1="-48" x2="0" y2="-40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <line x1="-12" y1="-44" x2="-6" y2="-38" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="12" y1="-44" x2="6" y2="-38" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Elegant Floral & Monogram Accent -->
  <path d="M 180 375 C 220 365 240 380 256 395 C 272 380 292 365 332 375" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="256" cy="395" r="4" fill="#E5C158"/>

  <!-- App Title Typography -->
  <text x="256" y="440" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">OUR WEDDING</text>
  <text x="256" y="468" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#EEDB96" text-anchor="middle" letter-spacing="6" opacity="0.85">PLANNER &amp; GUESTS</text>
</svg>
